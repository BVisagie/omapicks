name: Set up the pinned build environment
description: Install the repository Node version and locked dependencies, optionally Chromium
inputs:
  browser:
    description: Install Playwright Chromium
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
      shell: bash
    - if: inputs.browser == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
