name: Update availability

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommendation-publication
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.package.outputs.base_sha }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo 'Publishing must run from the default branch.' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - name: Observe current recommendation availability
        run: node build/availability.mjs
      - name: Validate availability and rendered pages
        run: npm run check
      - name: Validate install actions and current status
        run: npm run test:e2e
      - name: Package validated changes
        id: package
        run: node scripts/publication.mjs pack availability tmp/publication/manifest.json
      - name: Archive validated publication
        if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-availability-publication
          path: tmp/publication/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: availability-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain a no-op
        if: steps.package.outputs.changed == 'false'
        run: echo 'The upstream observation is unchanged; no commit or deployment requested.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-availability-publication
          path: tmp/publication
      - name: Publish current availability only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/publication.mjs publish availability tmp/publication/manifest.json
