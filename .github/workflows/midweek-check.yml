name: Midweek ranking check

on:
  schedule:
    - cron: "17 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranking-refresh
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install build dependencies
        run: npm ci
      - name: Validate live feeds and calculate candidate changes
        run: node build/refresh.mjs --dry-run
      - name: Archive classification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: classification-audit
          path: tmp/classification-audit/
          if-no-files-found: ignore
          retention-days: 90
      - name: Test committed data and production render
        run: npm run check
