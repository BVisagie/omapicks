<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OmaPicks: find an Omarchy plugin that fits your task. No votes, no sponsorships, a reproducible weekly snapshot.">
  <title>OmaPicks weekly Omarchy plugin rankings</title>
  <style>
    text { font-family: "CaskaydiaMono NF", "Cascadia Mono", "JetBrainsMono Nerd Font", "JetBrains Mono", "DejaVu Sans Mono", monospace; }
  </style>
  <defs>
    <radialGradient id="glow-a" gradientUnits="userSpaceOnUse" cx="120" cy="20" r="680">
      <stop offset="0" stop-color="#8bd5ca" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8bd5ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" gradientUnits="userSpaceOnUse" cx="1140" cy="660" r="640">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c0caf5" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b0d14"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="#c0caf5" stroke-opacity="0.18" stroke-width="2"/>

  <!-- brand -->
  <rect x="80" y="80" width="44" height="44" rx="10" fill="#121626"/>
  <path d="m90 92 8.5 10-8.5 10" fill="none" stroke="#8bd5ca" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <path d="M103 111h12" fill="none" stroke="#c0caf5" stroke-linecap="round" stroke-width="4"/>
  <text x="140" y="112" font-size="30" font-weight="700" fill="#c0caf5">OmaPicks</text>

  <!-- prompt -->
  <text x="80" y="222" font-size="26" fill="#8a93b8"><tspan fill="#8bd5ca" font-weight="800">$</tspan> omapicks rank --week <tspan fill="#8bd5ca">&#9608;</tspan></text>

  <!-- headline -->
  <text x="80" y="308" font-size="64" font-weight="700" fill="#c0caf5">find an omarchy plugin</text>
  <text x="80" y="384" font-size="64" font-weight="700" fill="#c0caf5">that fits your task.</text>

  <!-- comment -->
  <text x="80" y="446" font-size="24" fill="#8a93b8"># no votes. no sponsorships. a reproducible weekly snapshot.</text>

  <!-- status pill -->
  <rect x="80" y="520" width="1040" height="54" rx="27" fill="#121626" stroke="#c0caf5" stroke-opacity="0.18"/>
  <text x="110" y="554" font-size="20" fill="#8a93b8"><tspan fill="#8bd5ca" font-weight="700">omapicks.com</tspan>  &#183;  reviewed shortlist per category  &#183;  rescored every monday</text>
</svg>
